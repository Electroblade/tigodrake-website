<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TigoDrake | Software & Game Development</title>

    <meta name="description"
          content="TigoDrake is a South African software and game development company creating games, software and digital products.">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d12;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 25px;
            text-align: center;
        }

        .logo {
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .company {
            font-size: 16px;
            letter-spacing: 3px;
            color: #aeb4c0;
            margin-bottom: 45px;
        }

        .divider {
            width: 70px;
            height: 3px;
            margin: 0 auto 40px;
            background: #ffffff;
        }

        h1 {
            font-size: 34px;
            font-weight: 400;
            margin: 0 0 18px;
        }

        .intro {
            max-width: 650px;
            margin: 0 auto;
            font-size: 18px;
            line-height: 1.7;
            color: #c4c9d2;
        }

        .services {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 40px 0;
        }

        .service {
            border: 1px solid #303641;
            border-radius: 8px;
            padding: 14px 22px;
            color: #d9dde5;
            background: #12151c;
        }

        .contact {
            margin-top: 45px;
        }

        .contact a {
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 60px;
            color: #777e8a;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 40px;
            }

            h1 {
                font-size: 28px;
            }

            .intro {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">TigoDrake</div>

        <div class="company">
            TIGODRAKE (PTY) LTD
        </div>

        <div class="divider"></div>

        <h1>Software &amp; Game Development</h1>

        <p class="intro">
            TigoDrake is a South African software and game development company
            creating games, software and digital products.
        </p>

        <div class="services">
            <div class="service">Game Development</div>
            <div class="service">Software Development</div>
            <div class="service">Digital Products</div>
        </div>

        <div class="contact">
            <a href="mailto:contact@tigodrake.com">
                contact@tigodrake.com
            </a>
        </div>

        <footer>
            &copy; 2026 TIGODRAKE (PTY) LTD &mdash; South Africa
        </footer>

    </main>

</body>
</html>
